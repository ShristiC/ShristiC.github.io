<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Shristi Chitlangia</title>
  <meta name="description" content="Adventures, travels, food, and moments worth remembering.">
  <link rel="icon" href="assets/img/me_icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <div id="site-header"></div>

  <section class="page-hero">
    <div class="page-hero-bg"></div>
    <div class="blob blob-1" style="opacity:.18;"></div>
    <div class="blob blob-2" style="opacity:.15;"></div>
    <div class="page-hero-inner">
      <span class="section-label">Life in pictures</span>
      <h1 class="grad-text">Gallery</h1>
      <p>Adventures, food, trails, and moments I want to remember.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="gallery-grid">

        <!-- Real photos -->
        <div class="gal-item">
          <img src="assets/img/new_profile.jpg" alt="Shristi">
          <div class="gal-overlay"><i class="fas fa-expand"></i></div>
        </div>

        <div class="gal-item">
          <img src="assets/img/Shristi.jpg" alt="Shristi">
          <div class="gal-overlay"><i class="fas fa-expand"></i></div>
        </div>

        <div class="gal-item">
          <img src="assets/img/me.jpg" alt="Shristi">
          <div class="gal-overlay"><i class="fas fa-expand"></i></div>
        </div>

        <!-- Placeholder tiles for future photos -->
        <div class="gal-item">
          <div class="gal-ph bg-green"><i class="fas fa-person-hiking" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-blue"><i class="fas fa-hockey-puck" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-pink"><i class="fas fa-utensils" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-purple"><i class="fas fa-campground" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-blue"><i class="fas fa-bicycle" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-green"><i class="fas fa-mountain" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-pink"><i class="fas fa-book-open" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-purple"><i class="fas fa-city" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

        <div class="gal-item">
          <div class="gal-ph bg-blue"><i class="fas fa-water" style="color:#fff;opacity:.65;"></i></div>
          <div class="gal-overlay"><i class="fas fa-camera"></i></div>
        </div>

      </div>

      <div class="text-center mt-5" style="padding:2rem;border:2px dashed var(--border);border-radius:var(--r);background:var(--white);">
        <i class="fas fa-camera" style="font-size:1.75rem;color:var(--purple-dk);margin-bottom:.75rem;display:block;"></i>
        <h4 style="font-size:1.1rem;margin-bottom:.4rem;">More photos coming</h4>
        <p style="font-size:.88rem;">This section will grow over time with trail photos, food adventures, Boston life, and more.</p>
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
